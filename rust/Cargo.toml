[package]
name = "pokeuraou-damage"
version = "0.1.0"
edition = "2021"

[features]
# A counting global allocator, for answering "how many allocations is a turn" without
# guessing from the shape of the code. Off by default: the counter is not free.
count-allocations = ["profile"]
# Phase timers inside a turn. Off by default: a clock read is 25 ns and the innermost
# phase runs ten times a turn.
profile = []
# IKA-462: log every resolve_turn input (hashes) to $POKEURAOU_RESOLVE_LOG, to count repeats. Off by default.
count-resolves = []
# IKA-462: the selfplay worker adds up the fills' resolve/encode/bind microseconds and the server waits, and reports them. Off by default.
phase-report = []
# IKA-462: mimalloc as the global allocator. Off by default: in the steady-state ABBA of 2,000 games
# (records/IKA-462.md section 3.2) it bought nothing, and it adds a C build.
mimalloc = ["dep:mimalloc"]
# IKA-99: the 16 damage rolls in integer arithmetic instead of through f64. Same numbers
# (the product is far below 2^53); off by default until it is shown to buy anything.
int-rolls = []
# IKA-211's positive control: the node commands broken on purpose -- a resumed pause loses
# the last action of its queue, a replacement's switch-in runs as it is placed, the leads'
# skip the speed order, and a replayed draw is answered with its first option. Never for use; `tools/diff_commands.py` has to
# tell a build with it from one without.
ika211-control = []
ika209-control = []
# IKA-458 stage 3.2: the self-switch node takes the worst option instead of the best, a choice
# valued wrong while every leaf is right. Not for use; the positive control of a comparison.
ika458-selfswitch-control = []
# IKA-458 stage 3.6a's positive control: a replacement phase plays the option after the one it drew.
ika458-phase-control = []
# IKA-458 stage 3.6b's positive control: a move node plays the foe's option after the one it drew.
ika458-play-control = []
# IKA-458 stage 3.7's positive control: the Rust worker prepares the game after the one the queue named.
ika458-worker-control = []
# IKA-458 stage 3.7's positive control for a board arm on another executable: that executable's
# `moveNode` cuts each menu one action short. The worker's own executable is built without it.
ika458-arm-control = []
# IKA-458 stage 3.7's positive control for the board worker: side 1 draws its four from side 0's
# stream. Not for use; `tests/test_rust_board_worker.py` must fail against it.
ika458-board-control = []
# IKA-469's positive control: a played turn drawn along one path draws each chance point's
# options at their weights squared. Not for use; `tests/test_sample_turn.py` must fail against it.
ika469-control = []
# IKA-215's positive control: the trace broken on purpose -- no `acts` entry for the
# residual phase, and no "fainted" line. Never for use; `diff_commands --events` has to
# tell a build with it from one without.
ika215-control = []
# IKA-210's positive control: old rules the re-pointed tests hold, broken on purpose -- a
# recharge that never lifts, a self-switch cancelled beside an Eject Button or Emergency
# Exit, the residuals ordered (and a tie noted) after the weather has ended, 2-5 hits at
# 1/3, 1/3, 1/6, 1/6, and no branch merged. Never for use. And (IKA-210's second half) `fill`
# pricing a mid-turn replacement as the mean of the bench, which the `turn` command does not.
ika210-control = []
# IKA-32's fault: the cell threads' answers gathered in the order they finished rather than
# the order the cells were asked in. Never for use; a check that the answers agree at 1 and
# at N threads has to tell a build with it from one without.
ika32-control = []
# IKA-347's positive control: `encode-games` writes the turn feature one slot along. Never
# for use; the byte comparison against `tools/encode_dataset.py --engine python` has to fail.
ika347-control = []
# IKA-425's positive control: the side's state columns (turns left of Tailwind and the
# screens) written one slot along. Never for use; the byte comparison against
# `encode.py` (tests/test_encode_state_port.py) has to fail.
ika425-control = []
# IKA-429: the encoder computes every leaf's bind columns twice, through the pair cache and
# afresh, and panics where they differ. For checking the cache's keys on real fills only.
bind-verify = []
# IKA-429's positive controls. `ika429-control`: the encoder writes the side's bind columns
# one slot along (the `bind` request does not), so the comparison of Python's placement
# with the port's arrays (tests/test_encode_bind_port.py) has to fail.
# `ika429-cache-control`: the pair cache keys an HP-reading move without the HPs, so
# `bind-verify` has to stop on it.
ika429-control = []
ika429-cache-control = []

[dependencies]
serde = { version = "1", features = ["derive"] }
# `raw_value` (IKA-347): `encode-games` reads floats from their text, because the default
# float parser is not correctly rounded and the training arrays must be the bytes Python wrote.
# `float_roundtrip` (IKA-458 stage 3.5): a decimal read back exactly, for the selection solves'
# files (the strategies are Python's `repr` of a float); without it a read can be one ulp off.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }

# IKA-461: the inference server's CUDA calls. `dynamic-loading` reads the driver, NVRTC and
# cuBLAS at run time (the CUDA 12 DLLs of the `.venv`'s torch, or --dll-dir), so the build
# needs no CUDA toolkit; the other features are the three libraries' Rust wrappers.
# `cuda-12080` names the headers' version; the DLLs are checked when the server starts.
cudarc = { version = "=0.17.8", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "dynamic-loading", "cuda-12080"] }
# Pinned: from 0.8.6 `libloading` takes `windows-link`, which links kernel32 as `raw-dylib`
# and needs a `dlltool` on PATH with the windows-gnu toolchain (the reason `cmake` is pinned
# below 0.1.57 too). 0.8.5 takes `windows-targets`, whose import libraries come as crates.
libloading = "=0.8.5"
# IKA-462: the global allocator (windows-gnu `System` is HeapAlloc, a third of the worker CPU).
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[build-dependencies]
# IKA-381: builds vendor/HiGHS (1.12.0, scipy's commit) for the LP in src/lp.rs (build.rs).
# Pinned below 0.1.57: from there it links kernel32 as `raw-dylib`, which needs a dlltool
# on PATH with the windows-gnu toolchain.
cmake = "=0.1.54"
# The compiler cmake is handed on Windows (build.rs); already cmake's own dependency.
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
