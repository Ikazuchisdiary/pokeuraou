[package]
name = "pokeuraou-damage"
version = "0.1.0"
edition = "2021"

[features]
# A counting global allocator, for answering "how many allocations is a turn" without
# guessing from the shape of the code. Off by default: the counter is not free.
count-allocations = ["profile"]
# Phase timers inside a turn. Off by default: a clock read is 25 ns and the innermost
# phase runs ten times a turn.
profile = []
# IKA-99: the 16 damage rolls in integer arithmetic instead of through f64. Same numbers
# (the product is far below 2^53); off by default until it is shown to buy anything.
int-rolls = []
# IKA-211's positive control: the node commands broken on purpose -- a resumed pause loses
# the last action of its queue, a replacement's switch-in runs as it is placed, the leads'
# skip the speed order, and a replayed draw is answered with its first option. Never for use; `tools/diff_commands.py` has to
# tell a build with it from one without.
ika211-control = []
# IKA-210's positive control: old rules the re-pointed tests hold, broken on purpose -- a
# recharge that never lifts, a self-switch cancelled beside an Eject Button or Emergency
# Exit, the residuals ordered (and a tie noted) after the weather has ended, and 2-5 hits
# at 1/3, 1/3, 1/6, 1/6. Never for use.
ika210-control = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
