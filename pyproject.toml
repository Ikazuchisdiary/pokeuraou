[project]
name = "pokeuraou"
version = "0.0.0"
description = "Pokemon Champions doubles solver — belief state, fast turn resolver, LP equilibrium"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.scripts]
pokeuraou = "pokeuraou.cli:main"

[dependency-groups]
# psutil is here for pytest-xdist, not for anything in the code: `-n auto` means the
# physical core count when psutil is installed and `os.cpu_count()` -- the logical one --
# when it is not. On this machine that is 8 against 16, and the suite measured 72s at 8
# against 114s at 16. Sixteen workers on eight cores is slower than eight, so dropping
# psutil would not fail anything; it would quietly make the tests half again as slow.
dev = [
    "psutil>=7.2.2",
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.7",
]
# The value function only. Kept out of the default dependencies so the solver, the
# resolver and the differential tests stay installable without a 3 GB CUDA wheel -- and so
# that nothing in the analysis path can quietly start depending on torch.
learn = [
    "torch>=2.7",
]

# The GPU here is an RTX 5070 (Blackwell, sm_120), which the default PyPI wheel does not
# have kernels for; the CUDA 12.8 build does.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeuraou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 451 tests, and the five slowest are 43% of the wall clock, so the suite is worth
# distributing: 146s serially against 59-72s at `-n auto`. Debugging wants the serial
# run back -- `-n 0` restores it, and pdb needs it, because a breakpoint in a worker
# has no terminal to talk to.
#
# `--dist worksteal`, not the default `--dist load` (IKA-55). `load` hands each worker a
# run of *consecutive* tests and never takes one back, so the six heavy tests of
# `test_hidden_search.py` (13-30s each; the file is 125 of 431 test-seconds) arrived on
# one worker together: seven workers finished by 61s and the eighth ran alone to 142s. Whether the
# file lands in one chunk or two depends on integer chunk sizes computed from the test
# count, which is the 479-vs-480 step. `worksteal` lets an idle worker take half of a busy
# worker's queue, so the file spreads out whatever the count is.
addopts = "-q -n auto --dist worksteal"

[tool.ruff]
line-length = 110
target-version = "py312"
# `scratchpad/` is the record of one-off investigations -- each script is the exact code
# that answered one question on one day, hardcoded absolute paths and all, and is kept so
# a number in GENERATIONS.md can be traced back to what produced it. Reformatting those to
# please a linter would edit the record. Lint the code that runs again; leave the record.
#
# `vendor/` is the pinned Showdown checkout, which is a submodule rather than an ignored
# directory, so ruff walks into it and reports on someone else's Python. It only appears
# once the submodule is initialised, which is why this was invisible until CI did that.
extend-exclude = ["scratchpad", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
