# What this promises is not "the suite was green". It is that a named set of checks *ran*.
#
# Most of this file is build steps, and they are the point rather than the preamble. The
# oracle tests are the differential against Showdown itself; `test_rust_node` is the only
# thing standing between the Rust port and a silently different answer; both are written to
# skip when their dependency is missing, because on a laptop that is the right behaviour.
# On CI it would mean a green run that checked nothing, so CI builds them -- and then
# `tools/ci_skip_audit.py` refuses the run if they skipped anyway.
#
# The jobs are split by what a red one would mean:
#
#   lint     the code as text. No submodule, no node, no data. Seconds.
#   changes  whether this push changed anything but prose. See below.
#   suite    the engine, with everything it can be given built. A red here is a bug.
#   learn    the test files that name torch, with the value function's torch installed.
#            The checks that skip in `suite` for want of it (its `--absent torch` budget)
#            must not skip here. Separate
#            because a red caused by a multi-gigabyte wheel failing to install is not a red
#            about this codebase, and a run where those two are the same colour is a run
#            people stop reading.
#
# What IKA-465 took out, and why the promise still holds (records/IKA-465.md):
#
#   - `learn` ran the whole suite a second time: 2,837 of its 3,048 tests had passed in
#     `suite` already, and they were 1,441 of its 1,551 test-seconds. It now runs the files
#     `tools/ci_torch_tests.py` lists (every test file that names torch), and `suite` checks
#     that list against the torch skips it actually had, so a test that skips for torch
#     without naming it fails `suite` rather than going unrun.
#   - A push that changes only prose (`*.md`, `records/`) does not run `suite` and `learn`
#     when the CI run of the commit before it succeeded: the code they would test is that
#     commit's code, byte for byte, and it passed. `changes` waits for that run, and runs
#     everything when it failed, was cancelled or cannot be found. `lint` still runs, and
#     with it the one test that reads prose (`tests/test_line_endings.py`).
#   - The vendored Showdown, the sim-bridge and the port are restored from a cache keyed on
#     every input of their build instead of being built on every push. The port's key
#     holds its source and the files its unit tests read (`configs/regulations`,
#     `configs/vocab`), and is saved only after those tests passed, so a hit means "the
#     same inputs built and passed `cargo test`". A cold key builds as before.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# On master each commit is its own group (IKA-465), so each landing runs at once and to the
# end, and a prose push right after a code push waits in `changes` for that push's run.
# A group holds one running and one pending run, and a third cancels the pending one, so
# "do not cancel" alone would still have dropped landings and queued the rest. Other
# branches share a group per branch and cancel, so a worker pushing twice runs once.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Smogon publishes monthly and keeps old months, so a pinned month is a stable URL and
  # the cache key below is exact. Bumping it is a deliberate act: the usage data is an
  # input to the belief layer, and "which month" is part of what a measurement means.
  PRIORS_MONTH: "2026-08"
  PRIORS_FORMAT: gen9championsvgc2026regmb
  PRIORS_CUTOFF: "1760"

jobs:
  lint:
    name: ruff and the agent-drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      # The reason this file exists: `tools/agent_drift.py` was written to catch exactly
      # the drift that voided a year of board numbers, and nothing called it. `--check`
      # compares the drifted set against the one recorded in the tool and fails on any
      # movement in either direction.
      - name: which tools build an agent generation would not recognise
        run: uv run python tools/agent_drift.py --check

      # The same shape one layer down: `check_white_herb` was in the port from the first
      # day and `item_handled` was never told, so for eight days the port refused 63% of
      # generation's cells for an effect it had implemented. Source scanning only -- no
      # cargo, no node, no data -- which is why it belongs in this job.
      - name: what the Rust port's gates pass, and what they refuse that it implements
        run: uv run python tools/port_gate_audit.py --check

      # `rust/src/inert.rs` says it must be regenerated when the engine learns an effect,
      # and nothing checked that it had been: its header was reworded by hand after it was
      # generated, so regenerating it gave a diff with no id in it and "regenerate and diff"
      # could not be a test (IKA-72). This builds it and `modelled.rs` as the tool would,
      # writes neither, and fails on any byte that differs. It reads the engine's Python
      # source and the committed regulation dump -- no submodule, no cargo, no data.
      - name: whether the generated Rust lists are what the engine's source says
        run: uv run python tools/port_coverage.py --check

      # The one test that reads prose: every tracked file is LF. Here because a prose-only
      # push runs no `suite` (IKA-465), and a CRLF record is exactly what such a push holds.
      - name: every tracked file is LF
        run: uv run pytest tests/test_line_endings.py -n 0

  changes:
    name: whether this push changed anything but prose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # Prose is `*.md` and anything under `records/`. Everything else -- the workflow, a
      # lockfile, `.gitattributes` -- is code. A rename counts both its names. The compare
      # API lists at most 300 files; a push that long runs everything.
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          everything() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "suite and learn run: $1"; exit 0; }
          [ "$EVENT" = push ] || everything "the event is $EVENT, not a push"
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) everything "a new branch";; esac
          cmp=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER") || everything "no comparison with $BEFORE"
          status=$(jq -r .status <<<"$cmp")
          [ "$status" = ahead ] || everything "this push is $status of $BEFORE, not ahead of it"
          n=$(jq '.files | length' <<<"$cmp")
          [ "$n" -lt 300 ] || everything "$n files changed, at the compare API's limit"
          code=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$cmp" \
            | grep -Ev '\.md$|^records/' || true)
          [ -z "$code" ] || everything "code changed: $(head -5 <<<"$code" | tr '\n' ' ')"
          echo "prose only since $BEFORE ($n files); waiting for that commit's run"
          for i in $(seq 1 40); do
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$BEFORE&per_page=50" \
              --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion) \(.html_url)"')
            echo "$runs"
            if ok=$(grep -m1 ' completed success ' <<<"$runs"); then
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "suite and learn skip: the code is $BEFORE's, and its run passed: $ok"
              exit 0
            fi
            grep -Eq ' (queued|in_progress|waiting|pending|requested) ' <<<"$runs" \
              || everything "no run of $BEFORE succeeded"
            sleep 60
          done
          everything "$BEFORE's run did not finish in 40 minutes"

  suite:
    name: the suite, with the oracle and the Rust node built
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/pokemon-showdown is the pinned dex the oracle and the regulation dump
          # both read. Without it there is no oracle, and 31 differential tests skip.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable

      # Every input of each build, before anything is restored or built into the tree.
      # The port's key holds the compilers (`rustc -vV`, `g++ --version`) and the OS as well
      # as the source: g++ decides HiGHS's last bits (IKA-446), so a new compiler is a new
      # port. Not the image's weekly version: two runners of one run had two of them
      # (20261116 and 20261122, IKA-465), and the key missed on one of the two jobs. The
      # exe reads no repository file when it is built, but `cargo test` does: the regulation
      # dump (rust/src/moves_unit_tests.rs) and its vocab order (`Reg::load`, reg.rs), so
      # both are in the key, or a commit that changes only them would skip `cargo test`.
      - name: the cache keys of what this job builds
        id: keys
        run: |
          showdown=$(git rev-parse HEAD:vendor/pokemon-showdown)
          highs=$(git rev-parse HEAD:vendor/HiGHS)
          node=$(node --version)
          tools=$( (rustc -vV; g++ --version) | sha256sum | cut -c1-16)
          echo "showdown=showdown-$ImageOS-$node-$showdown" >> "$GITHUB_OUTPUT"
          echo "bridge=bridge-$ImageOS-$node-$showdown-${{ hashFiles('package.json', 'package-lock.json', 'packages/sim-bridge/**') }}" >> "$GITHUB_OUTPUT"
          echo "port=port-$ImageOS-$tools-$highs-${{ hashFiles('rust/**', 'configs/regulations/**', 'configs/vocab/**') }}" >> "$GITHUB_OUTPUT"

      # Showdown is a TypeScript source tree in the submodule; `main` points at dist/,
      # which only exists after its own build. Installing the workspace is not enough --
      # `require('pokemon-showdown')` fails with MODULE_NOT_FOUND until this runs.
      # `decl` also writes dist/**/*.d.ts; without them the sim-bridge's strict tsc fails
      # with TS7016 on every import of pokemon-showdown (the first CI run, IKA-51).
      - name: restore the vendored Showdown's build
        id: showdown
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/pokemon-showdown/node_modules
            vendor/pokemon-showdown/dist
            vendor/pokemon-showdown/config/config.js
          key: ${{ steps.keys.outputs.showdown }}
      - name: build the vendored Showdown
        if: steps.showdown.outputs.cache-hit != 'true'
        working-directory: vendor/pokemon-showdown
        run: |
          npm install --no-audit --no-fund
          node build decl
      - if: steps.showdown.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/pokemon-showdown/node_modules
            vendor/pokemon-showdown/dist
            vendor/pokemon-showdown/config/config.js
          key: ${{ steps.keys.outputs.showdown }}

      - name: restore the sim-bridge's build
        id: bridge
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/sim-bridge/dist
          key: ${{ steps.keys.outputs.bridge }}
      - name: build the sim-bridge
        if: steps.bridge.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build
      - if: steps.bridge.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/sim-bridge/dist
          key: ${{ steps.keys.outputs.bridge }}
      - name: the oracle has to exist before anything claims it was tested
        run: test -f packages/sim-bridge/dist/cli/oracle.js

      - name: restore the port built and unit-tested from this source
        id: port
        uses: actions/cache/restore@v4
        with:
          path: rust/target/release/pokeuraou-damage
          key: ${{ steps.keys.outputs.port }}
      # `rustnode` refuses a binary older than `rust/src` (IKA-212), and the checkout wrote
      # the sources just now. The key says the binary is this source's, so it is touched.
      - name: the restored port is this checkout's
        if: steps.port.outputs.cache-hit == 'true'
        run: |
          touch rust/target/release/pokeuraou-damage
          echo "the port and its cargo test came from the run that saved ${{ steps.keys.outputs.port }}"
      - uses: Swatinem/rust-cache@v2
        if: steps.port.outputs.cache-hit != 'true'
        with:
          workspaces: rust
      # IKA-381: the build also builds vendor/HiGHS (the submodule above) with cmake and g++,
      # both on the runner; the first build is a minute longer and rust-cache keeps it.
      - name: build the Rust node
        if: steps.port.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path rust/Cargo.toml
      # The port's own unit tests (rust/src/moves_unit_tests.rs), which took over what
      # test_resolve held of Python's copies (IKA-210). Release, so it reuses the build.
      - name: the Rust node's unit tests
        if: steps.port.outputs.cache-hit != 'true'
        run: cargo test --release --manifest-path rust/Cargo.toml
      - if: steps.port.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: rust/target/release/pokeuraou-damage
          key: ${{ steps.keys.outputs.port }}

      - run: uv sync --frozen

      # The usage statistics. Not committed -- they are fetched, not authored, and the
      # gitignore says so -- but `build_beliefs` refuses to invent a prior without them,
      # so without this step 21 tests fail outright and test_rust_node cannot even build
      # the node it exists to compare. Cached on the pinned month, so the fetch happens
      # once per month rather than once per push.
      - name: restore the cached Smogon usage statistics
        uses: actions/cache@v4
        with:
          path: data/priors/raw
          key: priors-${{ env.PRIORS_FORMAT }}-${{ env.PRIORS_MONTH }}-${{ env.PRIORS_CUTOFF }}
      - name: fetch the usage statistics if the cache was cold
        run: >
          uv run python tools/fetch_priors.py
          --month "$PRIORS_MONTH" --format "$PRIORS_FORMAT" --cutoff "$PRIORS_CUTOFF"

      # `-n auto` is 2 workers here: the runner has 4 logical cores on 2 physical, and auto
      # counts the physical ones (psutil, pyproject.toml). 4 workers took the pytest from
      # 524 s to 365-428 s, and in one run of four `tests/test_timing.py` read a child's
      # 0.4 s of CPU as 0.24 s: the clock tests need a core each is not sharing (IKA-465).
      - name: pytest
        run: uv run pytest --junitxml=reports/pytest.xml

      # `--absent NAME=N` is this job saying what it did not supply, and how many tests may
      # say so. Everything else must be built and must not skip; an unrecognised skip
      # reason is a failure on its own. The numbers are measured, not guessed:
      #   standings  data/standings/*.json.gz, from a small community API that the tool's
      #              own docstring calls a manual one-off fetch. Not called on every push.
      #   torch      thirty-five skips (IKA-439: tests/test_value_capacity.py, one more whole-module
      #              skip; IKA-435: eight more from the files IKA-425 to IKA-433 added
      #              without it -- tests/test_value_stage2a.py, test_value_state_inputs.py,
      #              test_value_aux_targets.py, test_value_bind_inputs.py,
      #              test_value_attention_warm.py, test_q_state_inputs.py,
      #              test_q_bind_inputs.py and test_encode_join_streamed.py, one each as the
      #              whole module skips; the budget was left at 26 and the audit failed the
      #              first run after IKA-425 stage 2a, which went unread);
      #              twenty-six skips before them (twelve counted on the first full CI run, IKA-51; two more
      #              from IKA-274's Q-net tests in tests/test_qhead.py, one from its local-
      #              against-served Q test in tests/test_q_rank.py, one from its graphed-Q
      #              test there, stage 3; one from IKA-307's batched Q pass in
      #              tests/test_deepen_guard.py; one from IKA-347's port-against-Python
      #              encoding in tests/test_encode_games_port.py; two from IKA-348's q_train
      #              resume tests in tests/test_q_train_resume.py; one from IKA-367's ladder with a learned
      #              leaf in tests/test_ladder_leaf.py; one from IKA-373's batch-graphed Q in
      #              tests/test_q_rank.py; one from IKA-405's widening tests, the whole of
      #              tests/test_value_widen.py; one from the packed dataset's tests, the
      #              whole of tests/test_packed.py; two from IKA-412's torch tests in
      #              tests/test_slotswap.py); the `learn` job below runs them with torch
      #              present and allows none of these.
      #   cuda       none here (the modules that need a card skip for torch first); the
      #              `learn` job has no card either and allows the twenty-one tests of the
      #              Rust inference server (IKA-461, tests/test_rust_inference_server.py, which
      #              skips as a module for torch in this job: one more torch skip, 36).
      #              IKA-460 removed M-B and the open game, and their tests with three torch
      #              skips, and added one (tests/test_play_roads.py): 34; stage 4 removed that
      #              file (its one torch skip) with the Python roads' tests: 33; step 2 removed
      #              the Python server's tests (the whole of tests/test_inference.py, which
      #              skipped as a module, and the two graphed-Q tests in tests/test_q_rank.py):
      #              30. The seven CUDA-graph tests of the Python server went with it, and so
      #              did the CPU-batch skip of its test. Step 4 added two tests of the Rust
      #              server's hp-share arm to that module: 23. IKA-464 removed the ladder and
      #              tests/test_ladder_leaf.py, which skipped as a module for torch: 29.
      #              IKA-464 stage A3 removed Python's deepening and its tests, among them
      #              tests/test_deepen_guard.py and its batched Q pass with torch: 28.
      - name: what the suite skipped, and whether it was allowed to
        if: always()
        run: >
          uv run python tools/ci_skip_audit.py --junit reports/pytest.xml
          --absent standings=9 --absent torch=28 --absent cuda=0

      # `learn` runs only the files that name torch (IKA-465). This is what makes that
      # enough: every test that skipped here for torch has to be in one of them.
      - name: every torch skip here is in a file the learn job runs
        if: always()
        run: uv run python tools/ci_torch_tests.py --check reports/pytest.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-suite
          path: reports/pytest.xml
          # A run that died before pytest wrote a report has already failed for a reason
          # worth reading; a second red about a missing upload only buries it.
          if-no-files-found: ignore

  learn:
    name: the torch tests with the value function installed
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable

      # The same keys as `suite`. This job only restores: `suite` saves each one after the
      # build (and, for the port, its unit tests) passed. On a miss it builds for itself.
      - name: the cache keys of what this job builds
        id: keys
        run: |
          showdown=$(git rev-parse HEAD:vendor/pokemon-showdown)
          highs=$(git rev-parse HEAD:vendor/HiGHS)
          node=$(node --version)
          tools=$( (rustc -vV; g++ --version) | sha256sum | cut -c1-16)
          echo "showdown=showdown-$ImageOS-$node-$showdown" >> "$GITHUB_OUTPUT"
          echo "bridge=bridge-$ImageOS-$node-$showdown-${{ hashFiles('package.json', 'package-lock.json', 'packages/sim-bridge/**') }}" >> "$GITHUB_OUTPUT"
          echo "port=port-$ImageOS-$tools-$highs-${{ hashFiles('rust/**', 'configs/regulations/**', 'configs/vocab/**') }}" >> "$GITHUB_OUTPUT"

      - name: restore the vendored Showdown's build
        id: showdown
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/pokemon-showdown/node_modules
            vendor/pokemon-showdown/dist
            vendor/pokemon-showdown/config/config.js
          key: ${{ steps.keys.outputs.showdown }}
      - name: build the vendored Showdown
        if: steps.showdown.outputs.cache-hit != 'true'
        working-directory: vendor/pokemon-showdown
        run: |
          npm install --no-audit --no-fund
          node build decl
      - name: restore the sim-bridge's build
        id: bridge
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/sim-bridge/dist
          key: ${{ steps.keys.outputs.bridge }}
      - name: build the sim-bridge
        if: steps.bridge.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build

      - name: restore the port built and unit-tested from this source
        id: port
        uses: actions/cache/restore@v4
        with:
          path: rust/target/release/pokeuraou-damage
          key: ${{ steps.keys.outputs.port }}
      - name: the restored port is this checkout's
        if: steps.port.outputs.cache-hit == 'true'
        run: touch rust/target/release/pokeuraou-damage
      - uses: Swatinem/rust-cache@v2
        if: steps.port.outputs.cache-hit != 'true'
        with:
          workspaces: rust
      - name: build the Rust node
        if: steps.port.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path rust/Cargo.toml

      - run: uv sync --frozen

      # The lockfile pins torch to the CUDA 12.8 index, because the box this project trains
      # on is a Blackwell card the default wheel has no kernels for. Resolving that on a
      # runner with no GPU drags the whole linux CUDA toolkit in -- several gigabytes of
      # kernels nothing here would call -- so this installs the CPU build instead, outside
      # the lockfile, and every `uv run` below passes `--no-sync` so the sync does not undo
      # it. Say plainly what that costs: this job checks that the value function's *code*
      # still runs, not that the training box's wheel still resolves. The second question
      # is a real one and this does not answer it.
      # Pinned to the lockfile's version (2.11.0, cu128 there): with an unpinned 2.14.0 the
      # batch-invariance test in test_inference moved a row by one float32 ulp (IKA-51).
      - name: install the CPU build of torch
        run: uv pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
      - name: torch has to be importable before this job claims anything
        run: uv run --no-sync python -c "import torch; print(torch.__version__)"

      - name: restore the cached Smogon usage statistics
        uses: actions/cache@v4
        with:
          path: data/priors/raw
          key: priors-${{ env.PRIORS_FORMAT }}-${{ env.PRIORS_MONTH }}-${{ env.PRIORS_CUTOFF }}
      - name: fetch the usage statistics if the cache was cold
        run: >
          uv run --no-sync python tools/fetch_priors.py
          --month "$PRIORS_MONTH" --format "$PRIORS_FORMAT" --cutoff "$PRIORS_CUTOFF"

      # The files that name torch (IKA-465); `suite` checks the list covers its torch skips.
      - name: pytest
        run: |
          mkdir -p reports
          uv run --no-sync python tools/ci_torch_tests.py | tee reports/learn-files.txt
          uv run --no-sync pytest $(cat reports/learn-files.txt) --junitxml=reports/pytest-learn.xml

      # No `--absent torch`: with the learn group installed, a torch skip here means the
      # install did not take, which is the one thing this job is for. None of the nine
      # standings skips is in a file that names torch, so their budget here is 0.
      - name: what the suite skipped, and whether it was allowed to
        if: always()
        run: >
          uv run --no-sync python tools/ci_skip_audit.py --junit reports/pytest-learn.xml
          --absent standings=0 --absent cuda=23

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-learn
          path: reports/pytest-learn.xml
          if-no-files-found: ignore
